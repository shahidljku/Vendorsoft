name: Quality Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    name: Verify Codebase
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/workers

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/workers/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Formatting Check
        run: npx prettier --check . || echo "Formatting issues found. Run prettier --write ."
        continue-on-error: true # Informational until fully adopted

      - name: Lint Check
        run: npx eslint . --ext .ts || echo "Linting issues found."
        continue-on-error: true # Informational until fully adopted

      - name: Dependency Audit
        run: npm audit --audit-level=high
        continue-on-error: true # Non-blocking initially as requested

      - name: Type Check
        run: npm run typecheck

      - name: Unit & Integration Tests
        run: npm run test

      - name: Bundle Size Report
        run: |
          npx wrangler deploy --dry-run --outdir=dist
          echo "### Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          ls -lh dist/index.js >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
