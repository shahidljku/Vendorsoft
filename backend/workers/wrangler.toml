name = "vendsoft-api-worker"
main = "src/index.ts"
compatibility_date = "2024-07-16"
compatibility_flags = ["nodejs_compat"]

[env.staging]
name = "vendsoft-api-worker-staging"
workers_dev = true

[env.staging.vars]
GCP_PROJECT_ID = "vendorpro-staging-1b2c3"
FIREBASE_PROJECT_ID = "vendorpro-staging-1b2c3"
ENVIRONMENT = "staging"
WORKER_VERSION = "0.0.0-dev"

[[env.staging.kv_namespaces]]
binding = "APK_STORE"
id = "mock_staging_kv_namespace_id"

[env.staging.triggers]
crons = ["0 2 * * *"]

[[env.staging.queues.producers]]
binding = "WEBHOOK_QUEUE"
queue = "vendsoft-webhooks-staging"

[[env.staging.queues.consumers]]
queue = "vendsoft-webhooks-staging"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "vendsoft-webhooks-dlq-staging"

[env.production]
name = "vendsoft-api-worker"
workers_dev = true

[env.production.vars]
GCP_PROJECT_ID = "vendorpro-491c4"
FIREBASE_PROJECT_ID = "vendorpro-491c4"
ENVIRONMENT = "production"
WORKER_VERSION = "0.0.0-dev"

[[env.production.kv_namespaces]]
binding = "APK_STORE"
id = "90d2c06b34a14527a66b1d40f41a3064"

[env.production.triggers]
crons = ["0 2 * * *"]

[[env.production.queues.producers]]
binding = "WEBHOOK_QUEUE"
queue = "vendsoft-webhooks-production"

[[env.production.queues.consumers]]
queue = "vendsoft-webhooks-production"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "vendsoft-webhooks-dlq-production"
